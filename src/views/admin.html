<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebSocket 管理页面</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f2f5; color: #1a1a1a; min-height: 100vh;
    }

    .header {
      background: #fff; border-bottom: 1px solid #e8e8e8;
      padding: 0 24px; height: 56px; display: flex;
      align-items: center; justify-content: space-between;
    }
    .header h1 { font-size: 18px; font-weight: 600; }
    .nav a {
      margin-left: 20px; text-decoration: none; font-size: 14px;
      color: #1677ff; padding: 6px 14px; border-radius: 6px;
      transition: background 0.2s;
    }
    .nav a:hover { background: #f0f5ff; }
    .nav a.active { background: #e6f4ff; font-weight: 500; }

    .main { max-width: 1200px; margin: 0 auto; padding: 24px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

    .stat-card {
      background: #fff; border-radius: 10px; padding: 20px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.04);
    }
    .stat-card .label { font-size: 13px; color: #999; margin-bottom: 6px; }
    .stat-card .value { font-size: 28px; font-weight: 700; }
    .stat-card .sub { font-size: 12px; color: #999; margin-top: 4px; }
    .stat-card.green .value { color: #22c55e; }

    .panel {
      background: #fff; border-radius: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.04);
      overflow: hidden;
    }
    .panel-header {
      padding: 14px 20px; font-size: 14px; font-weight: 600;
      border-bottom: 1px solid #f0f0f0;
    }
    .panel-body { padding: 20px; }

    textarea {
      width: 100%; height: 160px; padding: 12px;
      border: 1px solid #d9d9d9; border-radius: 8px;
      font-size: 14px; font-family: 'SF Mono', 'Fira Code', monospace;
      resize: vertical; transition: border-color 0.2s;
    }
    textarea:focus {
      outline: none; border-color: #1677ff;
      box-shadow: 0 0 0 2px rgba(22,119,255,0.1);
    }

    .button-row { display: flex; gap: 10px; margin-top: 16px; }
    button {
      padding: 10px 24px; border: none; border-radius: 8px;
      font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.2s;
    }
    .btn-primary { background: #1677ff; color: #fff; }
    .btn-primary:hover { background: #4096ff; }
    .btn-primary:disabled { background: #a0c4ff; cursor: not-allowed; }
    .btn-outline {
      background: #fff; color: #1677ff; border: 1px solid #1677ff;
    }
    .btn-outline:hover { background: #f0f5ff; }

    .result {
      margin-top: 16px; padding: 12px 16px; border-radius: 8px;
      font-size: 13px; display: none;
    }
    .result.show { display: block; }
    .result.success { background: #f6ffed; color: #389e0d; border: 1px solid #b7eb8f; }
    .result.error { background: #fff2f0; color: #cf1322; border: 1px solid #ffccc7; }

    .msg-preview {
      background: #fafafa; border-radius: 8px;
      border: 1px dashed #d9d9d9; padding: 16px; min-height: 160px;
    }
    .msg-preview .empty { color: #bbb; font-size: 13px; text-align: center; padding-top: 50px; }
    .msg-preview pre {
      font-size: 13px; white-space: pre-wrap; word-break: break-all; color: #333;
      font-family: 'SF Mono', 'Fira Code', monospace;
    }

    @media (max-width: 768px) {
      .grid-2 { grid-template-columns: 1fr; }
      .grid-4 { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>WebSocket 管理</h1>
    <div class="nav">
      <a href="/">首页</a>
      <a href="/admin" class="active">Admin</a>
      <a href="/timer">定时广播</a>
      <a href="/reports">Reports</a>
    </div>
  </div>

  <div class="main">
    <div class="grid-4">
      <div class="stat-card green">
        <div class="label">已连接客户端</div>
        <div class="value" id="clientCount">0</div>
        <div class="sub">实时更新</div>
      </div>
    </div>

    <div class="grid-2">
      <div class="panel">
        <div class="panel-header">消息编辑</div>
        <div class="panel-body">
          <textarea id="messageInput" placeholder='输入 JSON 消息，例如：{"type": "notice", "content": "hello"}'>{"type": "broadcast", "message": "这是一条测试消息"}</textarea>
          <div class="button-row">
            <button class="btn-primary" id="sendBtn" onclick="sendMessage()">发送到所有客户端</button>
            <button class="btn-outline" onclick="formatJson()">格式化 JSON</button>
          </div>
          <div class="result" id="result"></div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-header">上次广播的消息</div>
        <div class="panel-body">
          <div class="msg-preview">
            <pre id="lastMessage" class="empty">暂无</pre>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let lastBroadcast = null;

    function $(id) { return document.getElementById(id); }

    function showResult(type, msg) {
      const el = $('result');
      el.className = 'result show ' + type;
      el.textContent = msg;
      setTimeout(() => { el.className = 'result'; }, 5000);
    }

    async function sendMessage() {
      const btn = $('sendBtn');
      const raw = $('messageInput').value.trim();
      if (!raw) { showResult('error', '消息内容不能为空'); return; }

      let payload;
      try { payload = JSON.parse(raw); } catch {
        showResult('error', 'JSON 格式无效，请检查后重试'); return;
      }

      btn.disabled = true;
      btn.textContent = '发送中...';

      try {
        const res = await fetch('/api/broadcast', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (data.success) {
          lastBroadcast = payload;
          const pre = $('lastMessage');
          pre.textContent = JSON.stringify(payload, null, 2);
          pre.className = '';
          showResult('success', '发送成功！已向 ' + data.clientCount + ' 个客户端广播');
        } else {
          showResult('error', '发送失败: ' + data.message);
        }
      } catch (err) {
        showResult('error', '请求失败: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = '发送到所有客户端';
        refreshClients();
      }
    }

    function formatJson() {
      const raw = $('messageInput').value.trim();
      try { $('messageInput').value = JSON.stringify(JSON.parse(raw), null, 2); }
      catch { showResult('error', 'JSON 格式无效，无法格式化'); }
    }

    async function refreshClients() {
      try {
        const res = await fetch('/api/clients');
        const data = await res.json();
        $('clientCount').textContent = data.clientCount;
      } catch {}
    }

    refreshClients();
    setInterval(refreshClients, 5000);
  </script>
</body>
</html>
