<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>定时广播</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 640px;
      padding: 32px;
    }
    h1 { font-size: 22px; color: #1a1a1a; margin-bottom: 8px; }
    .subtitle { font-size: 14px; color: #666; margin-bottom: 24px; }

    .status-bar {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 16px;
      background: #f6f8fa; border-radius: 8px;
      margin-bottom: 24px; font-size: 14px;
    }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #ccc; }
    .dot.connected { background: #22c55e; }
    .dot.timer-active { animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

    .badge {
      display: inline-block; padding: 2px 10px; border-radius: 12px;
      font-size: 12px; font-weight: 500;
    }
    .badge-running { background: #f6ffed; color: #389e0d; }
    .badge-stopped { background: #f5f5f5; color: #999; }

    .section-title { font-size: 15px; font-weight: 600; color: #333; margin-bottom: 10px; }
    textarea, input {
      width: 100%; padding: 12px; border: 1px solid #d9d9d9;
      border-radius: 8px; font-size: 14px; font-family: inherit;
      transition: border-color 0.2s;
    }
    textarea { height: 100px; resize: vertical; }
    textarea:focus, input:focus {
      outline: none; border-color: #1677ff;
      box-shadow: 0 0 0 2px rgba(22,119,255,0.1);
    }

    .form-row { display: flex; gap: 12px; align-items: flex-end; }
    .form-row > div { flex: 1; }
    .form-row label { display: block; font-size: 13px; color: #666; margin-bottom: 6px; }
    .button-row { display: flex; gap: 10px; margin-top: 16px; }
    button {
      padding: 10px 24px; border: none; border-radius: 8px;
      font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.2s;
    }
    .btn-start { background: #22c55e; color: #fff; }
    .btn-start:hover { background: #16a34a; }
    .btn-start:disabled { background: #bbf7d0; cursor: not-allowed; }
    .btn-stop { background: #ef4444; color: #fff; }
    .btn-stop:hover { background: #dc2626; }
    .btn-stop:disabled { background: #fecaca; cursor: not-allowed; }
    .btn-outline {
      background: #fff; color: #1677ff; border: 1px solid #1677ff;
    }
    .btn-outline:hover { background: #f0f5ff; }

    .result {
      margin-top: 16px; padding: 12px 16px; border-radius: 8px;
      font-size: 13px; display: none;
    }
    .result.show { display: block; }
    .result.success { background: #f6ffed; color: #389e0d; border: 1px solid #b7eb8f; }
    .result.error { background: #fff2f0; color: #cf1322; border: 1px solid #ffccc7; }

    .log-section { margin-top: 24px; }
    .log-list {
      max-height: 200px; overflow-y: auto;
      background: #fafafa; border: 1px dashed #d9d9d9;
      border-radius: 8px; padding: 12px;
      font-size: 12px; color: #555;
    }
    .log-list .empty { color: #bbb; text-align: center; padding: 20px 0; }
    .log-item { padding: 4px 0; border-bottom: 1px solid #f0f0f0; }
    .log-item:last-child { border-bottom: none; }
    .log-item .time { color: #999; margin-right: 8px; }
    .log-item .count { color: #1677ff; }
  </style>
</head>
<body>
  <div class="container">
    <h1>定时循环广播</h1>
    <p class="subtitle">按固定间隔向所有已连接的 WebSocket 客户端循环发送消息</p>

    <div class="status-bar">
      <span>客户端</span>
      <span class="dot" id="clientDot"></span>
      <strong id="clientCount">0</strong>
      <span style="margin-left:12px">定时器</span>
      <span class="dot" id="timerDot"></span>
      <span id="timerBadge" class="badge badge-stopped">已停止</span>
    </div>

    <div class="form-row">
      <div>
        <label>消息内容（JSON）</label>
        <textarea id="messageInput" placeholder='{"type":"ping","data":"hello"}'>{"type":"timer","message":"定时广播消息"}</textarea>
      </div>
    </div>

    <div class="form-row" style="margin-top:12px">
      <div style="flex:0 0 180px">
        <label>发送间隔（秒）</label>
        <input type="number" id="intervalInput" value="5" min="1" max="3600">
      </div>
      <div style="display:flex;align-items:flex-end;padding-bottom:1px">
        <span style="font-size:13px;color:#999">建议 ≥ 3 秒</span>
      </div>
    </div>

    <div class="button-row">
      <button class="btn-start" id="startBtn" onclick="startTimer()">启动定时广播</button>
      <button class="btn-stop" id="stopBtn" onclick="stopTimer()" disabled>停止定时广播</button>
      <button class="btn-outline" onclick="formatJson()">格式化 JSON</button>
    </div>

    <div class="result" id="result"></div>

    <div class="log-section">
      <div class="section-title">广播日志</div>
      <div class="log-list" id="logList">
        <div class="empty">暂无广播记录</div>
      </div>
    </div>
  </div>

  <script>
    let pollTimer = null;
    let lastSendCount = 0;

    function $(id) { return document.getElementById(id); }

    function showResult(type, msg) {
      const el = $('result');
      el.className = 'result show ' + type;
      el.textContent = msg;
      setTimeout(() => { el.className = 'result'; }, 5000);
    }

    async function startTimer() {
      const raw = $('messageInput').value.trim();
      if (!raw) { showResult('error', '消息内容不能为空'); return; }

      let payload;
      try { payload = JSON.parse(raw); } catch {
        showResult('error', 'JSON 格式无效'); return;
      }

      const interval = parseInt($('intervalInput').value, 10);
      if (!interval || interval < 1) { showResult('error', '间隔必须 >= 1 秒'); return; }

      try {
        const res = await fetch('/api/timer/start', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: payload, interval })
        });
        const data = await res.json();
        if (data.success) {
          showResult('success', '定时广播已启动！间隔 ' + interval + ' 秒');
          lastSendCount = 0;
          updateUI(true);
        } else {
          showResult('error', data.message);
        }
      } catch (err) {
        showResult('error', '请求失败: ' + err.message);
      }
    }

    async function stopTimer() {
      try {
        const res = await fetch('/api/timer/stop', { method: 'POST' });
        const data = await res.json();
        if (data.success) {
          showResult('success', '定时广播已停止，共发送 ' + (data.status.sendCount || 0) + ' 次');
          updateUI(false);
        } else {
          showResult('error', data.message);
        }
      } catch (err) {
        showResult('error', '请求失败: ' + err.message);
      }
    }

    function formatJson() {
      const raw = $('messageInput').value.trim();
      try { $('messageInput').value = JSON.stringify(JSON.parse(raw), null, 2); }
      catch { showResult('error', 'JSON 格式无效，无法格式化'); }
    }

    async function refreshStatus() {
      try {
        const [cs, ts] = await Promise.all([
          fetch('/api/clients').then(r => r.json()),
          fetch('/api/timer/status').then(r => r.json())
        ]);

        $('clientCount').textContent = cs.clientCount;
        const cDot = $('clientDot');
        cDot.className = 'dot' + (cs.clientCount > 0 ? ' connected' : '');

        if (ts.success && ts.status) {
          updateUI(ts.status.active);
          if (ts.status.active && ts.status.sendCount !== lastSendCount) {
            lastSendCount = ts.status.sendCount;
            addLogEntry(ts.status.sendCount, cs.clientCount);
          }
        }
      } catch {}
    }

    function updateUI(active) {
      $('startBtn').disabled = active;
      $('stopBtn').disabled = !active;
      $('intervalInput').disabled = active;
      $('messageInput').disabled = active;
      const badge = $('timerBadge');
      const dot = $('timerDot');

      if (active) {
        badge.textContent = '运行中';
        badge.className = 'badge badge-running';
        dot.className = 'dot connected timer-active';
      } else {
        badge.textContent = '已停止';
        badge.className = 'badge badge-stopped';
        dot.className = 'dot';
      }
    }

    function addLogEntry(count, clientCount) {
      const list = $('logList');
      if (list.querySelector('.empty')) list.innerHTML = '';
      const now = new Date();
      const time = now.getHours().toString().padStart(2,'0') + ':' +
                   now.getMinutes().toString().padStart(2,'0') + ':' +
                   now.getSeconds().toString().padStart(2,'0');
      const div = document.createElement('div');
      div.className = 'log-item';
      div.innerHTML = '<span class="time">' + time + '</span> 第 <span class="count">' + count + '</span> 次广播 → ' + clientCount + ' 个客户端';
      list.prepend(div);
      if (list.children.length > 50) list.removeChild(list.lastChild);
    }

    refreshStatus();
    pollTimer = setInterval(refreshStatus, 2000);
  </script>
</body>
</html>
