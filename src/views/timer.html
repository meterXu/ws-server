<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>定时广播</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/codemirror.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f2f5; color: #1a1a1a; min-height: 100vh;
    }

    .header {
      background: #fff; border-bottom: 1px solid #e8e8e8;
      padding: 0 24px; height: 56px; display: flex;
      align-items: center; justify-content: space-between;
    }
    .header h1 { font-size: 18px; font-weight: 600; }
    .nav a {
      margin-left: 20px; text-decoration: none; font-size: 14px;
      color: #1677ff; padding: 6px 14px; border-radius: 6px;
      transition: background 0.2s;
    }
    .nav a:hover { background: #f0f5ff; }
    .nav a.active { background: #e6f4ff; font-weight: 500; }

    .main { max-width: 1200px; margin: 0 auto; padding: 24px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }

    .stat-card {
      background: #fff; border-radius: 10px; padding: 20px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.04);
    }
    .stat-card .label { font-size: 13px; color: #999; margin-bottom: 6px; }
    .stat-card .value { font-size: 28px; font-weight: 700; }
    .stat-card .sub { font-size: 12px; color: #999; margin-top: 4px; }
    .stat-card.green .value { color: #22c55e; }
    .stat-card.blue .value { color: #1677ff; }
    .stat-card.orange .value { color: #f59e0b; }

    .dot-row { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #ccc; flex-shrink: 0; }
    .dot.active { background: #22c55e; }
    .dot.pulse { animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

    .panel {
      background: #fff; border-radius: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.04);
      overflow: hidden;
      margin-bottom: 16px;
    }
    .panel-header {
      padding: 14px 20px; font-size: 14px; font-weight: 600;
      border-bottom: 1px solid #f0f0f0;
      display: flex; align-items: center; justify-content: space-between;
    }
    .panel-header .hint { font-size: 12px; color: #999; font-weight: 400; }
    .panel-body { padding: 20px; }

    textarea, input[type="number"] {
      width: 100%; padding: 12px; border: 1px solid #d9d9d9;
      border-radius: 8px; font-size: 14px; font-family: inherit;
      transition: border-color 0.2s;
    }
    textarea { height: 100px; resize: vertical; font-family: 'SF Mono', 'Fira Code', monospace; }
    textarea:focus, input:focus {
      outline: none; border-color: #1677ff;
      box-shadow: 0 0 0 2px rgba(22,119,255,0.1);
    }

    /* CodeMirror — main form */
    .form-row .CodeMirror {
      border: 1px solid #d9d9d9; border-radius: 8px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-row .CodeMirror-focused {
      border-color: #1677ff; box-shadow: 0 0 0 2px rgba(22,119,255,0.1);
    }

    .form-row { display: flex; gap: 12px; align-items: flex-end; }
    .form-row > div { flex: 1; }
    .form-row label { display: block; font-size: 13px; color: #666; margin-bottom: 6px; }

    .button-row { display: flex; gap: 10px; margin-top: 16px; }
    button {
      padding: 10px 24px; border: none; border-radius: 8px;
      font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.2s;
    }
    .btn-start { background: #22c55e; color: #fff; }
    .btn-start:hover { background: #16a34a; }
    .btn-start:disabled { background: #bbf7d0; cursor: not-allowed; }
    .btn-stop { background: #ef4444; color: #fff; }
    .btn-stop:hover { background: #dc2626; }
    .btn-outline {
      background: #fff; color: #1677ff; border: 1px solid #1677ff;
    }
    .btn-outline:hover { background: #f0f5ff; }

    .result {
      margin-top: 16px; padding: 12px 16px; border-radius: 8px;
      font-size: 13px; display: none;
    }
    .result.show { display: block; }
    .result.success { background: #f6ffed; color: #389e0d; border: 1px solid #b7eb8f; }
    .result.error { background: #fff2f0; color: #cf1322; border: 1px solid #ffccc7; }

    /* Timer cards */
    .timer-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 12px;
      align-items: start;
    }
    .timer-grid .empty {
      grid-column: 1 / -1; text-align: center; color: #bbb;
      padding: 40px 0; font-size: 14px;
    }

    .timer-card {
      min-width: 0; /* 防止长内容撑大列宽、挤压相邻卡片 */
      border: 1px solid #f0f0f0; border-radius: 10px;
      padding: 16px; background: #fafafa;
      transition: box-shadow 0.2s, border-color 0.2s;
    }
    .timer-card:hover { border-color: #d9d9d9; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .timer-card.active { border-left: 3px solid #22c55e; background: #f9fefb; }
    .timer-card.stopped { border-left: 3px solid #d9d9d9; }

    .timer-card .tc-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 10px;
    }
    .timer-card .tc-id { font-weight: 600; font-size: 14px; }
    .timer-card .tc-msg {
      font-size: 12px; font-family: 'SF Mono', 'Fira Code', monospace;
      background: #f5f5f5; padding: 8px 10px; border-radius: 6px;
      word-break: break-all; max-height: 40px; overflow: hidden;
      color: #555; margin-bottom: 10px; white-space: nowrap;
      text-overflow: ellipsis;
    }
    .timer-card .tc-meta {
      display: flex; gap: 16px; font-size: 12px; color: #888; margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .timer-card .tc-meta span { white-space: nowrap; }
    .timer-card .tc-actions { display: flex; gap: 8px; }

    .badge {
      display: inline-block; padding: 2px 10px; border-radius: 12px;
      font-size: 12px; font-weight: 500; flex-shrink: 0;
    }
    .badge-running { background: #f6ffed; color: #389e0d; }
    .badge-stopped { background: #f5f5f5; color: #999; }

    .btn-sm {
      padding: 5px 14px; border: none; border-radius: 6px;
      font-size: 12px; font-weight: 500; cursor: pointer; transition: all 0.2s;
    }
    .btn-sm-start { background: #22c55e; color: #fff; }
    .btn-sm-start:hover { background: #16a34a; }
    .btn-sm-stop { background: #ef4444; color: #fff; }
    .btn-sm-stop:hover { background: #dc2626; }
    .btn-sm-del { background: #fff; color: #999; border: 1px solid #d9d9d9; }
    .btn-sm-del:hover { background: #fff2f0; color: #ef4444; border-color: #ffccc7; }

	    .btn-sm-format { background: #fff; color: #1677ff; border: 1px solid #1677ff; }
	    .btn-sm-format:hover { background: #f0f5ff; }
	    .btn-sm-save { background: #1677ff; color: #fff; }
	    .btn-sm-save:hover { background: #0958d9; }

	    .tc-edit-area { margin-bottom: 10px; }
	    .tc-edit-area label { font-size: 12px; color: #666; display: block; margin-bottom: 4px; }
	    .tc-edit-cm { border: 1px solid #d9d9d9; border-radius: 6px; overflow: hidden; }
	    .tc-edit-cm .CodeMirror {
	      height: auto; min-height: 70px; font-size: 12px;
	      font-family: 'SF Mono', 'Fira Code', monospace; border-radius: 6px;
	    }
	    .tc-edit-cm .CodeMirror-scroll { min-height: 70px; }
	    .tc-edit-cm.focused { border-color: #1677ff; box-shadow: 0 0 0 2px rgba(22,119,255,0.1); }
	    .tc-edit-interval {
	      width: 120px; padding: 6px 10px; border: 1px solid #d9d9d9;
	      border-radius: 6px; font-size: 13px; transition: border-color 0.2s;
	    }
	    .tc-edit-interval:focus { outline: none; border-color: #1677ff; box-shadow: 0 0 0 2px rgba(22,119,255,0.1); }

    /* Log */
    .log-feed {
      max-height: 300px; overflow-y: auto; padding: 8px 0;
    }
    .log-feed .empty { color: #bbb; text-align: center; padding: 30px 0; font-size: 13px; }
    .log-entry {
      padding: 8px 20px; font-size: 12px;
      border-bottom: 1px solid #f9f9f9; display: flex; gap: 10px; align-items: center;
    }
    .log-entry:last-child { border-bottom: none; }
    .log-entry .time { color: #999; white-space: nowrap; min-width: 55px; }
    .log-entry .tid { color: #1677ff; font-weight: 500; min-width: 36px; }
    .log-entry .count { color: #1677ff; font-weight: 500; }
    .log-entry .detail { color: #555; }

    @media (max-width: 768px) {
      .timer-grid { grid-template-columns: 1fr; }
      .grid-4 { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>定时循环广播</h1>
    <div class="nav">
      <a href="/">首页</a>
      <a href="/admin">推送</a>
      <a href="/timer" class="active">广播</a>
      <a href="/reports">日志</a>
    </div>
  </div>

  <div class="main">
    <div class="grid-4">
      <div class="stat-card green">
        <div class="label">已连接客户端</div>
        <div class="value" id="clientCount">0</div>
        <div class="dot-row"><span class="dot" id="clientDot"></span><span class="sub">在线</span></div>
      </div>
      <div class="stat-card blue">
        <div class="label">活跃定时器</div>
        <div class="value" id="activeCount">0</div>
        <div class="sub" id="totalTimerCount">共 0 个定时器</div>
      </div>
      <div class="stat-card orange">
        <div class="label">累计广播次数</div>
        <div class="value" id="totalSends">0</div>
        <div class="sub">所有定时器合计</div>
      </div>
    </div>

    <!-- Add timer form -->
    <div class="panel">
      <div class="panel-header">
        添加定时广播
        <span class="hint">可同时运行多个定时器</span>
      </div>
      <div class="panel-body">
        <div class="form-row">
          <div>
            <label>消息内容（JSON）</label>
            <textarea id="messageInput" placeholder='{"type":"ping","data":"hello"}'>{
  "type": "timer",
  "message": "定时广播消息"
}</textarea>
          </div>
        </div>
        <div class="form-row" style="margin-top:12px">
          <div style="flex:0 0 180px">
            <label>发送间隔（秒）</label>
            <input type="number" id="intervalInput" value="2" min="1" max="3600">
          </div>
          <div style="display:flex;align-items:flex-end;padding-bottom:1px">
            <span style="font-size:13px;color:#999">最低 1 秒，建议 ≥ 5 秒</span>
          </div>
        </div>
        <div class="button-row">
          <button class="btn-start" id="startBtn" onclick="addTimer()">添加并启动</button>
          <button class="btn-outline" onclick="formatJson()">格式化 JSON</button>
        </div>
        <div class="result" id="result"></div>
      </div>
    </div>

    <!-- Timer list -->
    <div class="panel">
      <div class="panel-header">定时器列表</div>
      <div class="panel-body">
        <div class="timer-grid" id="timerList">
          <div class="empty">暂无定时广播任务，请添加一个</div>
        </div>
      </div>
    </div>

    <!-- Broadcast log -->
    <div class="panel">
      <div class="panel-header">广播日志</div>
      <div class="log-feed" id="logList">
        <div class="empty">暂无广播记录</div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/mode/javascript/javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/addon/edit/matchbrackets.min.js"></script>
  <script>
    let pollTimer = null;
    let prevTimers = [];
    let pendingOps = new Set(); // 防止重复操作
    let mainEditor = null;
    let timerEditors = new Map(); // id -> { editor, wrapper }

    function $(id) { return document.getElementById(id); }

    function formatEditor(cm) {
      const raw = cm.getValue().trim();
      if (!raw) return;
      try {
        const formatted = JSON.stringify(JSON.parse(raw), null, 2);
        if (formatted !== raw) {
          const cursor = cm.getCursor();
          cm.setValue(formatted);
          // Restore cursor position as close as possible
          const newLastLine = cm.lastLine();
          const targetLine = Math.min(cursor.line, newLastLine);
          cm.setCursor({ line: targetLine, ch: Math.min(cursor.ch, cm.getLine(targetLine).length) });
        }
      } catch {
        // Not valid JSON yet — leave as-is so the user can keep typing
      }
    }

    function initMainEditor() {
      const ta = $('messageInput');
      if (!ta) return;
      mainEditor = CodeMirror.fromTextArea(ta, {
        mode: { name: 'javascript', json: true },
        lineNumbers: true,
        matchBrackets: true,
        lineWrapping: true,
        tabSize: 2,
        indentUnit: 2,
        extraKeys: { 'Shift-Alt-F': function(cm) { formatEditor(cm); } }
      });
      mainEditor.setSize(null, 100);
      mainEditor.on('blur', () => formatEditor(mainEditor));
    }

    function destroyTimerEditors() {
      for (const [id, { editor, wrapper }] of timerEditors) {
        const parent = wrapper.parentElement;
        if (parent) {
          // Restore the textarea from CodeMirror before removing the wrapper
          const ta = wrapper.querySelector('textarea');
          if (ta) {
            ta.value = editor.getValue();
            parent.replaceChild(ta, wrapper);
          }
        }
      }
      timerEditors.clear();
    }

    function initTimerEditors() {
      document.querySelectorAll('.tc-edit-msg').forEach(ta => {
        const id = ta.getAttribute('data-id');
        if (!id || timerEditors.has(id)) return;

        // Wrap textarea in a container for border/focus styling
        const wrapper = document.createElement('div');
        wrapper.className = 'tc-edit-cm';
        ta.parentElement.insertBefore(wrapper, ta);
        wrapper.appendChild(ta);

        const editor = CodeMirror.fromTextArea(ta, {
          mode: { name: 'javascript', json: true },
          lineNumbers: true,
          matchBrackets: true,
          lineWrapping: true,
          tabSize: 2,
          indentUnit: 2,
          extraKeys: { 'Shift-Alt-F': function(cm) { formatEditor(cm); } }
        });
        editor.setSize(null, 80);

        editor.on('focus', () => wrapper.classList.add('focused'));
        editor.on('blur', () => {
          wrapper.classList.remove('focused');
          formatEditor(editor);
        });

        timerEditors.set(id, { editor, wrapper });
      });
    }

    function busy(id) { return pendingOps.has(id); }
    function lock(id) { pendingOps.add(id); }
    function unlock(id) { pendingOps.delete(id); }

    function formatTimerEditor(id) {
      const entry = timerEditors.get(String(id));
      if (entry) formatEditor(entry.editor);
    }

    function showResult(type, msg) {
      const el = $('result');
      el.className = 'result show ' + type;
      el.textContent = msg;
      setTimeout(() => { el.className = 'result'; }, 5000);
    }

    function elapsed(ts) {
      const s = Math.floor((Date.now() - ts) / 1000);
      if (s < 60) return s + 's';
      if (s < 3600) return Math.floor(s / 60) + 'm' + (s % 60) + 's';
      return Math.floor(s / 3600) + 'h' + Math.floor((s % 3600) / 60) + 'm';
    }

    async function addTimer() {
      const raw = mainEditor.getValue().trim();
      if (!raw) { showResult('error', '消息内容不能为空'); return; }

      let payload;
      try { payload = JSON.parse(raw); } catch {
        showResult('error', 'JSON 格式无效'); return;
      }

      const interval = parseInt($('intervalInput').value, 10);
      if (!interval || interval < 1) { showResult('error', '间隔必须 >= 1 秒'); return; }

      try {
        const res = await fetch('/api/timer/start', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: payload, interval })
        });
        const data = await res.json();
        if (data.success) {
          showResult('success', '定时器 #' + data.timer.id + ' 已启动，间隔 ' + interval + ' 秒');
          await refreshStatus();
        } else {
          showResult('error', data.message);
        }
      } catch (err) {
        showResult('error', '请求失败: ' + err.message);
      }
    }

    async function stopTimer(id) {
      const key = 'stop:' + id;
      if (busy(key)) return;
      lock(key);
      try {
        const res = await fetch('/api/timer/stop', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id })
        });
        const data = await res.json();
        if (data.success) {
          showResult('success', '定时器 #' + id + ' 已停止');
          await refreshStatus();
        } else {
          showResult('error', data.message);
        }
      } catch (err) {
        showResult('error', '请求失败: ' + err.message);
      } finally {
        unlock(key);
      }
    }

    async function restartTimer(id) {
      const key = 'restart:' + id;
      if (busy(key)) return;
      const timer = prevTimers.find(t => t.id === id);
      if (!timer) return;
      lock(key);
      try {
        const [startRes] = await Promise.all([
          fetch('/api/timer/start', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: timer.message, interval: Math.round(timer.intervalMs / 1000) })
          }).then(r => r.json()),
          fetch('/api/timer/remove', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id })
          }).then(r => r.json())
        ]);
        if (startRes.success) {
          showResult('success', '定时器已重启为新 #' + startRes.timer.id);
          await refreshStatus();
        } else {
          showResult('error', startRes.message);
        }
      } catch (err) {
        showResult('error', '请求失败: ' + err.message);
      } finally {
        unlock(key);
      }
    }

    async function saveAndRestartTimer(id) {
      const key = 'edit-restart:' + id;
      if (busy(key)) return;

      const entry = timerEditors.get(String(id));
      const intervalEl = document.querySelector('.tc-edit-interval[data-id="' + id + '"]');
      if (!entry || !intervalEl) { showResult('error', '找不到编辑字段'); return; }

      const raw = entry.editor.getValue().trim();
      if (!raw) { showResult('error', '消息内容不能为空'); return; }

      let payload;
      try { payload = JSON.parse(raw); } catch {
        showResult('error', 'JSON 格式无效'); return;
      }

      const interval = parseInt(intervalEl.value, 10);
      if (!interval || interval < 1) { showResult('error', '间隔必须 >= 1 秒'); return; }

      lock(key);
      try {
        const [startRes] = await Promise.all([
          fetch('/api/timer/start', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: payload, interval })
          }).then(r => r.json()),
          fetch('/api/timer/remove', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id })
          }).then(r => r.json())
        ]);
        if (startRes.success) {
          showResult('success', '定时器已更新并重启为新 #' + startRes.timer.id);
          await refreshStatus();
        } else {
          showResult('error', startRes.message);
        }
      } catch (err) {
        showResult('error', '请求失败: ' + err.message);
      } finally {
        unlock(key);
      }
    }

    async function removeTimer(id) {
      try {
        const res = await fetch('/api/timer/remove', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id })
        });
        const data = await res.json();
        if (data.success) {
          showResult('success', '定时器 #' + id + ' 已删除');
          await refreshStatus();
        } else {
          showResult('error', data.message);
        }
      } catch (err) {
        showResult('error', '请求失败: ' + err.message);
      }
    }

    function formatJson() {
      const raw = mainEditor.getValue().trim();
      try { mainEditor.setValue(JSON.stringify(JSON.parse(raw), null, 2)); }
      catch { showResult('error', 'JSON 格式无效，无法格式化'); }
    }

    function renderTimerList(timers) {
      const container = $('timerList');
      destroyTimerEditors();

      $('activeCount').textContent = timers.filter(t => t.active).length;
      $('totalTimerCount').textContent = '共 ' + timers.length + ' 个定时器';
      $('totalSends').textContent = timers.reduce((s, t) => s + t.sendCount, 0);

      if (timers.length === 0) {
        container.innerHTML = '<div class="empty">暂无定时广播任务，请添加一个</div>';
        return;
      }

      container.innerHTML = timers.map(t => {
        const active = t.active;
        if (active) {
          return `
            <div class="timer-card active" data-timer-id="${t.id}">
              <div class="tc-header">
                <span class="tc-id">定时器 #${t.id}</span>
                <span class="badge badge-running">运行中</span>
              </div>
              <div class="tc-msg" title="${escAttr(JSON.stringify(t.message))}">${escHtml(JSON.stringify(t.message))}</div>
              <div class="tc-meta">
                <span>间隔: ${t.intervalMs / 1000}s</span>
                <span class="tc-send-count">已发送: ${t.sendCount} 次</span>
                <span class="tc-elapsed">已运行: ${elapsed(t.startAt)}</span>
              </div>
              <div class="tc-actions">
                <button class="btn-sm btn-sm-stop" onclick="stopTimer(${t.id})">停止</button>
                <button class="btn-sm btn-sm-del" onclick="removeTimer(${t.id})">删除</button>
              </div>
            </div>`;
        }
        const editRaw = t._editRaw !== undefined ? t._editRaw : JSON.stringify(t.message, null, 2);
        const editInterval = t._editInterval !== undefined ? t._editInterval : (t.intervalMs / 1000);
        return `
          <div class="timer-card stopped" data-timer-id="${t.id}">
            <div class="tc-header">
              <span class="tc-id">定时器 #${t.id}</span>
              <span class="badge badge-stopped">已停止</span>
            </div>
            <div class="tc-edit-area">
              <label>消息内容（JSON）</label>
              <textarea class="tc-edit-msg" data-id="${t.id}">${escHtml(editRaw)}</textarea>
            </div>
            <div class="tc-edit-area">
              <label>发送间隔（秒，最低 1 秒）</label>
              <input type="number" class="tc-edit-interval" data-id="${t.id}" value="${editInterval}" min="1" max="3600">
            </div>
            <div class="tc-meta">
              <span class="tc-send-count">已发送: ${t.sendCount} 次</span>
            </div>
            <div class="tc-actions">
              <button class="btn-sm btn-sm-format" onclick="formatTimerEditor(${t.id})">格式化</button>
              <button class="btn-sm btn-sm-save" onclick="saveAndRestartTimer(${t.id})">保存并重启</button>
              <button class="btn-sm btn-sm-del" onclick="removeTimer(${t.id})">删除</button>
            </div>
          </div>`;
      }).join('');

      // Activate CodeMirror on newly rendered textareas
      initTimerEditors();
    }

    function sameStructure(oldList, newList) {
      if (!oldList || oldList.length !== newList.length) return false;
      for (let i = 0; i < oldList.length; i++) {
        if (oldList[i].id !== newList[i].id) return false;
        if (oldList[i].active !== newList[i].active) return false;
      }
      return true;
    }

    function updateDynamicFields(timers) {
      const container = $('timerList');
      $('activeCount').textContent = timers.filter(t => t.active).length;
      $('totalSends').textContent = timers.reduce((s, t) => s + t.sendCount, 0);
      for (const t of timers) {
        if (!t.active) continue;
        const card = container.querySelector('.timer-card[data-timer-id="' + t.id + '"]');
        if (!card) continue; // DOM mismatch, fall back to full render next poll
        const sendEl = card.querySelector('.tc-send-count');
        if (sendEl) sendEl.textContent = '已发送: ' + t.sendCount + ' 次';
        const elapsedEl = card.querySelector('.tc-elapsed');
        if (elapsedEl) elapsedEl.textContent = '已运行: ' + elapsed(t.startAt);
      }
    }

    function escHtml(s) {
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function escAttr(s) {
      return s.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function addLogEntry(timerId, count, clientCount) {
      const list = $('logList');
      if (list.querySelector('.empty')) list.innerHTML = '';
      const now = new Date();
      const time = now.getHours().toString().padStart(2,'0') + ':' +
                   now.getMinutes().toString().padStart(2,'0') + ':' +
                   now.getSeconds().toString().padStart(2,'0');
      const div = document.createElement('div');
      div.className = 'log-entry';
      div.innerHTML = '<span class="time">' + time + '</span> <span class="tid">#' + timerId + '</span> <span>第 <span class="count">' + count + '</span> 次广播</span> <span class="detail">→ ' + clientCount + ' 个客户端</span>';
      list.prepend(div);
      if (list.children.length > 80) list.removeChild(list.lastChild);
    }

    async function refreshStatus() {
      try {
        const [cs, ts] = await Promise.all([
          fetch('/api/clients').then(r => r.json()),
          fetch('/api/timer/status').then(r => r.json())
        ]);

        $('clientCount').textContent = cs.clientCount;
        $('clientDot').className = 'dot' + (cs.clientCount > 0 ? ' active' : '');

        if (ts.success && ts.timers) {
          // Detect new broadcasts
          for (const t of ts.timers) {
            const prev = prevTimers.find(p => p.id === t.id);
            if (prev && t.sendCount > prev.sendCount && t.active) {
              addLogEntry(t.id, t.sendCount, cs.clientCount);
            }
          }
          if (sameStructure(prevTimers, ts.timers)) {
            // Structure unchanged: only update dynamic numbers, don't touch DOM
            updateDynamicFields(ts.timers);
          } else {
            // Structure changed: preserve in-progress edits, then full re-render
            for (const t of ts.timers) {
              if (!t.active) {
                const entry = timerEditors.get(String(t.id));
                const intervalEl = document.querySelector('.tc-edit-interval[data-id="' + t.id + '"]');
                if (entry) t._editRaw = entry.editor.getValue();
                if (intervalEl) t._editInterval = intervalEl.value;
              }
            }
            renderTimerList(ts.timers);
          }
          prevTimers = ts.timers;
        }
      } catch {}
    }

    initMainEditor();
    refreshStatus();
    pollTimer = setInterval(refreshStatus, 2000);
  </script>
</body>
</html>
