<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌾☠️信使</title>
  <link rel="stylesheet" href="/views/common.css">
  <style>
    /* ---- client table ---- */
    .table-wrap { max-height: 280px; overflow-y: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th {
      text-align: left; padding: 10px 20px; background: #fafafa;
      color: #666; font-weight: 500; font-size: 12px;
      position: sticky; top: 0; z-index: 1;
    }
    td { padding: 10px 20px; border-bottom: 1px solid #f5f5f5; }
    .state-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
    .state-dot.open { background: #22c55e; }
    .state-dot.closed { background: #ccc; }
    .btn-kick {
      padding: 4px 12px; border: 1px solid #ef4444; border-radius: 4px;
      background: #fff; color: #ef4444; font-size: 12px; cursor: pointer;
      transition: all 0.2s;
    }
    .btn-kick:hover { background: #ef4444; color: #fff; }

    /* ---- progress bars ---- */
    .metric-row { padding: 12px 20px; }
    .metric-row:not(:last-child) { border-bottom: 1px solid #f9f9f9; }
    .metric-label { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px; }
    .bar-track { height: 8px; background: #f0f0f0; border-radius: 4px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 4px; transition: width 0.5s ease; }
    .bar-fill.low { background: #22c55e; }
    .bar-fill.mid { background: #f59e0b; }
    .bar-fill.high { background: #ef4444; }

    /* ---- log feed ---- */
    .log-feed { max-height: 280px; overflow-y: auto; padding: 8px 0; }
    .log-entry {
      padding: 8px 20px; font-size: 12px; font-family: 'SF Mono', 'Fira Code', monospace;
      border-bottom: 1px solid #f9f9f9; display: flex; gap: 10px;
    }
    .log-entry .time { color: #999; white-space: nowrap; min-width: 65px; }
    .log-entry .tag {
      display: inline-block; padding: 0 6px; border-radius: 3px;
      font-size: 10px; font-weight: 600; line-height: 18px; white-space: nowrap;
      min-width: 42px; text-align: center;
    }
    .log-entry .tag.send { background: #e6f4ff; color: #1677ff; }
    .log-entry .tag.recv { background: #f6ffed; color: #389e0d; }
    .log-entry .detail { color: #555; word-break: break-all; flex: 1; }
  </style>
</head>
<body>
  <div class="main">
    <!-- stat cards -->
    <div class="grid-4">
      <div class="stat-card green">
        <div class="label">WebSocket 连接数</div>
        <div class="value" id="clientCount">0</div>
        <div class="sub">上限 1000</div>
      </div>
      <div class="stat-card blue">
        <div class="label">CPU 使用率</div>
        <div class="value" id="cpuUsage">--</div>
        <div class="sub" id="cpuModel">--</div>
      </div>
      <div class="stat-card orange">
        <div class="label">堆内存</div>
        <div class="value" id="heapUsed">--</div>
        <div class="sub" id="heapTotal">--</div>
      </div>
      <div class="stat-card red">
        <div class="label">运行时间</div>
        <div class="value" id="uptime">--</div>
        <div class="sub" id="systemMem">--</div>
      </div>
    </div>

    <!-- panels -->
    <div class="grid-2">
      <!-- client list -->
      <div class="panel">
        <div class="panel-header">
          已连接客户端
          <span class="badge" id="clientBadge">0 个在线</span>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>IP</th>
                <th>连接时间</th>
                <th>状态</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="clientTbody">
              <tr><td colspan="5"><div class="empty">暂无客户端连接</div></td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- message log -->
      <div class="panel">
        <div class="panel-header">
          消息日志
          <span class="badge" id="logBadge">最近 50 条</span>
        </div>
        <div class="log-feed" id="logFeed">
          <div class="empty">暂无消息</div>
        </div>
      </div>
    </div>

    <!-- resource details -->
    <div class="panel" style="margin-top:16px">
      <div class="panel-header">系统资源</div>
      <div id="resourceBars"></div>
    </div>
  </div>

  <script src="/views/common.js"></script>
  <script>
    renderHeader('🌾☠️️信使', '/');

    function barColor(pct) {
      if (pct < 50) return 'low';
      if (pct < 80) return 'mid';
      return 'high';
    }

    async function kickClient(id) {
      if (!confirm('确定要踢出客户端 #' + id + ' 吗？')) return;
      try {
        const res = await fetch('/api/clients/kick/' + id, { method: 'POST' });
        const data = await res.json();
        if (data.success) refreshAll();
      } catch {}
    }

    async function refreshAll() {
      try {
        const [cd, ss, lg] = await Promise.all([
          fetch('/api/clients/detail').then(r => r.json()).catch(() => null),
          fetch('/api/system/stats').then(r => r.json()).catch(() => null),
          fetch('/api/logs?limit=50').then(r => r.json()).catch(() => null)
        ]);

        // client list
        if (cd && cd.success) {
          const clients = cd.clients || [];
          const openClients = clients.filter(c => c.isOpen);
          $('clientCount').textContent = openClients.length;
          $('clientBadge').textContent = openClients.length + ' 个在线';
          const tbody = $('clientTbody');
          if (clients.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5"><div class="empty">暂无客户端连接</div></td></tr>';
          } else {
            tbody.innerHTML = clients.map(c => {
              const time = c.connectedAt ? new Date(c.connectedAt).toLocaleTimeString('zh-CN') : '--';
              return '<tr>' +
                '<td>' + c.id + '</td>' +
                '<td>' + c.ip + '</td>' +
                '<td>' + time + '</td>' +
                '<td><span class="state-dot ' + (c.isOpen ? 'open' : 'closed') + '"></span>' + (c.isOpen ? '在线' : '离线') + '</td>' +
                '<td>' + (c.isOpen ? '<button class="btn-kick" onclick="kickClient(' + c.id + ')">踢出</button>' : '--') + '</td>' +
                '</tr>';
            }).join('');
          }
        }

        // system stats
        if (ss && ss.success) {
          const stats = ss.stats;
          $('cpuUsage').textContent = stats.cpu.usagePercent + '%';
          $('cpuModel').textContent = stats.cpu.cores + ' 核 · ' + stats.cpu.model;
          $('heapUsed').textContent = fmtBytes(stats.memory.heapUsedMB);
          $('heapTotal').textContent = '总量 ' + fmtBytes(stats.memory.heapTotalMB);
          $('uptime').textContent = fmtUptime(stats.uptime);
          $('systemMem').textContent = '系统内存 ' + Math.round(stats.memory.systemUsedPercent) + '%';

          // resource bars
          const bars = [
            { label: 'CPU', pct: stats.cpu.usagePercent, detail: Math.round(stats.cpu.usagePercent) + '%' },
            { label: '堆内存 (Heap)', pct: stats.memory.heapTotalMB > 0 ? (stats.memory.heapUsedMB / stats.memory.heapTotalMB * 100) : 0, detail: fmtBytes(stats.memory.heapUsedMB) + ' / ' + fmtBytes(stats.memory.heapTotalMB) },
            { label: 'RSS', pct: stats.memory.systemTotalMB > 0 ? (stats.memory.rssMB / stats.memory.systemTotalMB * 100) : 0, detail: fmtBytes(stats.memory.rssMB) },
            { label: '系统内存', pct: stats.memory.systemUsedPercent, detail: fmtBytes(stats.memory.systemTotalMB - stats.memory.systemFreeMB) + ' / ' + fmtBytes(stats.memory.systemTotalMB) },
            { label: 'Load Average (1m/5m/15m)', pct: stats.cpu.loadAvg1m / stats.cpu.cores * 100, detail: stats.cpu.loadAvg1m.toFixed(2) + ' / ' + stats.cpu.loadAvg5m.toFixed(2) + ' / ' + stats.cpu.loadAvg15m.toFixed(2) }
          ];
          $('resourceBars').innerHTML = bars.map(b =>
            '<div class="metric-row">' +
              '<div class="metric-label"><span>' + b.label + '</span><span>' + b.detail + '</span></div>' +
              '<div class="bar-track"><div class="bar-fill ' + barColor(b.pct) + '" style="width:' + Math.min(b.pct, 100) + '%"></div></div>' +
            '</div>'
          ).join('');
        }

        // logs
        if (lg && lg.success) {
          const logs = lg.logs || [];
          const feed = $('logFeed');
          if (logs.length === 0) {
            feed.innerHTML = '<div class="empty">暂无消息</div>';
          } else {
            feed.innerHTML = logs.map(l => {
              const time = l.time ? new Date(l.time).toLocaleTimeString('zh-CN') : '';
              const isSend = l.type === 'send';
              const detailText = isSend
                ? ('→ ' + l.clientCount + ' 客户端, ' + (l.bytes || 0) + ' B: ' + (typeof l.data === 'string' ? l.data : JSON.stringify(l.data)).slice(0, 80))
                : ('← 来自 #' + l.clientId + ' ' + l.ip + ': ' + (l.data || '').slice(0, 80));
              return '<div class="log-entry">' +
                '<span class="time">' + time + '</span>' +
                '<span class="tag ' + (isSend ? 'send' : 'recv') + '">' + (isSend ? '发送' : '接收') + '</span>' +
                '<span class="detail">' + detailText + '</span>' +
                '</div>';
            }).join('');
          }
        }
      } catch {}
    }

    refreshAll();
    setInterval(refreshAll, 2000);
  </script>
</body>
</html>
